interface:
  display_name: "Starline Study Web"
  author: "墨点星痕 (starline)"
  short_description: "将 TXT、PDF、PPTX 和公开视频整理为带页码标签的图文学习网页"
  default_prompt: "Use $starline-study-web to inspect supplied TXT, PDF, PPT/PPTX, or public video links. Before outlining or rendering, create experience-brief.md that fixes the primary learner, opening context, ten-second success, one primary action, reading path, evidence return, information density, mobile first-screen target, progressive disclosure, and visual anti-patterns. For substantial design work, research current official Apple guidance, Kimi's official public interface, and credible design skills now, recording keep/adapt/reject rather than imitating brands. Then preserve line, page, slide, transcript, and timestamp provenance; mark the core 20 percent; and build a learning loop with retrieval questions whose answers are hidden by default, a specific teach-back prompt, one real transfer action, and an adjustable spaced-review plan stored only locally. Build the responsive HTML and regress the first render against the brief. Never invent inaccessible content, claim a fixed forgetting curve, download protected media, or publish customer material without explicit authorization."
  examples:
    - "把这份培训 PPT 做成图文学习笔记网页"
    - "识别这份图片型 PDF，按二八法则批注并生成可按标签定位的网页"
    - "综合 TXT 和公开视频链接，生成带时间戳引用的学习专题页"
    - "Turn this deck and transcript into an illustrated HTML study guide"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic", "agent-skills-compatible", "vscode"]
  activation:
    mode: "automatic-or-manual"
    paths: []
  execution:
    context: "inline"
    shell: "powershell-or-bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_media_policy: "read public metadata or captions only; never bypass access controls"
    generated_claims: "source-grounded"
  permissions:
    network: "read-only access to user-supplied public video pages, captions, and licensed image sources"
    file_read: "user-supplied TXT/PDF/PPTX and explicitly scoped workspace assets"
    file_write: "one user-scoped learning-note output directory"
    subprocess: "bundled Python extraction, rendering, validation, and tests"
    publishing: "forbidden unless explicitly requested"
  degradation:
    no_network: "process local sources and mark video links inaccessible"
    no_transcript: "use page description only as limited evidence or request transcript"
    no_images: "render semantic HTML/CSS diagrams and disclose missing image assets"
    legacy_ppt: "request PPTX conversion or use available LibreOffice"
gates:
  production:
    - "at least one readable source"
    - "source locator for every core claim"
    - "visual relevance and alt text"
    - "experience-brief regression after first render"
    - "retrieval, teach-back, transfer, and adjustable spaced-review loop"
    - "pre-render experience brief"
    - "passing trigger eval and script tests"
    - "responsive local HTML delivery"
